server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-fleetops

  # V0.2 当前默认关闭所有 Spring AI 模型自动配置。
  # 这样即使没有 API Key，V0.1 的 FleetOps 主业务也可以正常启动。
  # 真正接入 Qwen / DeepSeek 时，再将 chat 改为 openai，并配置兼容接口地址与 API Key。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_fleetops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.aifleetops: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# AI FleetOps 自己的模型开关，与 spring.ai.model.* 的自动配置开关分开管理。
ai:
  model:
    # false：使用 NoopAiModelProvider，AI 不可用但 FleetOps 主业务正常运行。
    # true：使用 SpringAiModelProvider；同时必须开启 spring.ai.model.chat 并配置真实模型连接信息。
    enabled: false
    provider: qwen
