server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-fleetops

  # V0.2 接入百炼 Qwen：通过 OpenAI 兼容模式调用模型。
  # API Key 与 Base URL 从环境变量 / .env 文件读取，避免写入代码仓库。
  ai:
    openai:
      api-key: ${BAILIAN_API_KEY:}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${BAILIAN_MODEL:qwen-plus}
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_fleetops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.aifleetops: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# AI FleetOps 自己的模型开关，与 spring.ai.model.* 的自动配置开关分开管理。
ai:
  model:
    # false：使用 NoopAiModelProvider，AI 不可用但 FleetOps 主业务正常运行。
    # true：使用 SpringAiModelProvider；同时必须开启 spring.ai.model.chat 并配置真实模型连接信息。
    enabled: true
    provider: qwen
